version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Bun workspace: the "bun" ecosystem updates bun.lock together with package.json,
  # which the "npm" ecosystem cannot do (its PRs always failed --frozen-lockfile).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions (TypeScript 7, Node types, React, Vite, …) are upgraded deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
