name: E2E smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke against Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run the smokes with the preinstalled Chrome
        env:
          LOCASTACK_E2E: "1"
          LOCASTACK_E2E_CHANNEL: chrome
        run: bun run e2e
      - name: Upload report and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            packages/dashboard/playwright-report
            packages/dashboard/e2e/.screenshots
          if-no-files-found: ignore
